[main]
# Ignores brief carrier drops during the USB handshake
ignore-carrier=false
# Ensures that profiles are automatically created for new USB network hardware
no-auto-default=
[keyfile]
unmanaged-devices=

[connection]
# Forces new Wi-Fi connections to apply globally to all users.
# This causes NetworkManager to bypass KWallet and store the password directly.Document type abbreviation
permissions=

# Automatically activates LAN interfaces immediately upon hot-plugging
connection.autoconnect=true
connection.autoconnect-priority=100
# Automatically prioritizes Ethernet interfaces over Wi-Fi
ethernet.auto-activate=true