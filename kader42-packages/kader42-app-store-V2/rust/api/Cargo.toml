[package]
name = "kader42-software-center-api"
version = "2.0.0"
edition = "2021"

[dependencies]
# Auf v5.0 aktualisieren (unterstützt libalpm v16 / pacman 7):
alpm = "5.0"

# Weitere Crates auf aktuelle Hauptversionen anheben:
tokio = { version = "1.40", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }

listenfd = "1.0"