# ==========================================
# KADER4² ROLLBACK HOOK ACTIVATION
# ==========================================

# We append our hook to the end of the existing HOOKS array.
# Important: It MUST come after ‘filesystems’ and ‘udev’ 
# so that the partitions and drives are available in early userspace.
# ==========================================

# Check whether the hook already exists in the HOOKS array
if [[ ! " ${HOOKS[*]} " =~ " kader42-rollback " ]]; then
    # Nur anhängen, wenn er noch nicht drin ist
    HOOKS+=("kader42-rollback")
fi

if [[ ! " ${HOOKS[*]} " =~ " kader42-mountcheck " ]]; then
    # Nur anhängen, wenn er noch nicht drin ist
    HOOKS+=("kader42-mountcheck")
fi