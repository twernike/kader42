title   Kader42 – Live System (Default)
sort-key 00
linux   /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
# FIRST, the microcodes (Important!)
initrd  /%INSTALL_DIR%/boot/intel-ucode.img
initrd  /%INSTALL_DIR%/boot/amd-ucode.img
# THEN the actual initramfs
initrd  /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# OPTIMISED: ibt=off for 13th Gen Intel and i915.modeset for the VM
options rw archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% ibt=off i915.modeset=1 loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0 i915.enable_psr=0 intel_idle.max_cstate=4 cow_spacesize=10G quiet
