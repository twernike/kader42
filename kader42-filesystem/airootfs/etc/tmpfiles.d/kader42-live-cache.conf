# /etc/tmpfiles.d/kader42-live-cache.conf
# Löscht KWin/Plasma Cache-Dateien im Live-System, die älter als 1 Stunde sind
d /home/liveuser/.cache/kwin 0755 liveuser liveuser 1h
d /home/liveuser/.cache/plasma* 0755 liveuser liveuser 1h
d /home/liveuser/.cache/mesa_shader_cache 0755 liveuser liveuser 1h