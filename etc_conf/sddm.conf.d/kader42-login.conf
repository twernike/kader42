[General]
# Zwingt SDDM, Wayland statt X11 zu nutzen
DisplayServer=wayland
# Verhindert Skalierungsprobleme bei High-DPI-Displays (wie beim Framework)
InputMethod=qtvirtualkeyboard

[Wayland]
# Nutze KWin von Plasma 6 als Compositor für den Login-Bildschirm
CompositorCommand=kwin_wayland --no-lockscreen
SessionDir=/usr/share/wayland-sessions

[Theme]
# Hier weisen wir dein Theme sauber zu
Current=breeze
CursorTheme=breeze_cursors

[General]
# Dein gewünschtes Hintergrundbild
background=login-screen.png
